<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專業請假系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  body { font-family: "Helvetica Neue", Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
  h2, h3 { margin-bottom: 10px; }
  
  /* 按鈕樣式 */
  .btn-success {
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 10px; /* 稍微縮小圓角 */
    font-size: 20px;     /* 原為 28px * 0.7 ≈ 20px */
    font-weight: bold;
    padding: 20px 28px;  /* 原為 28px 40px * 0.7 ≈ 20px 28px */
    min-height: 63px;    /* 原為 90px * 0.7 = 63px */
    width: 100%;
    max-width: 280px;    /* 原為 400px * 0.7 = 280px */
    margin: 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

  /* 卡片清單樣式 */
  #leaveRecordList { margin-top: 20px; }
  .record-item {
    background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #2196f3;
    display: flex; justify-content: space-between; align-items: center;
  }
  .record-info { display: flex; flex-direction: column; gap: 4px; }
  .status-badge { font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 6px; }
  .badge-未簽核 { background: #ffebee; color: #f44336; }
  .badge-簽核中 { background: #fff3e0; color: #ff9800; }
  .badge-已簽核 { background: #e8f5e9; color: #4caf50; }

  /* SweetAlert 優化 */
  .swal-btn { font-size: 38px !important; font-weight: bold !important; padding: 30px 52px !important; border-radius: 18px !important; min-width: 220px !important; }
  .swal2-title { font-size: 42px !important; }
  .swal2-html-container { font-size: 34px !important; }
  .swal2-html-container label { font-size: 32px !important; font-weight: bold; }
  .swal2-html-container input, .swal2-html-container select { font-size: 30px !important; padding: 24px !important; }
</style>
</head>

<body>

<h2 id="userInfo">載入中...</h2>
<h3 id="annualInfo">載入年假中...</h3>

<button id="btnLeaveApply" class="btn-success">我要請假</button>

<div id="leaveRecordList">
  <div style="text-align:center; padding:20px;">載入中...</div>
</div>

<script>
const API_ENDPOINT="https://script.google.com/macros/s/AKfycbwhoKVajT28FGO-FRhHZTt2sD8XhiS9isHKnbTLAZy5HlN3NR-pJDb31VGytElioN0FLw/exec";

let userId="", userName="", remainHours=0;

function normalizeTime(t){
  if(!t) return "00:00";
  const parts=t.split(":").map(p=>p.padStart(2,"0"));
  return parts[0]+":"+parts[1];
}

async function getRealtimeRemainHours(){
  const leaveRes = await fetch(`${API_ENDPOINT}?action=getLeaveRecords&userId=${userId}`);
  const records = await leaveRes.json();

  let usedSigned=0, usedPending=0;

  records.forEach(r=>{
    if(r.leaveType==="特休"){
      if(r.signStatus==="已簽核") usedSigned += parseFloat(r.leaveHours||0);
      else usedPending += parseFloat(r.leaveHours||0);
    }
  });

  const empRes = await fetch(`${API_ENDPOINT}?action=getUserInfo&userId=${userId}`);
  const empInfo = await empRes.json();

  return (empInfo.total || 0) - usedSigned - usedPending;
}

async function initLIFF() {
  try {
    await liff.init({ liffId: "2009444587-t79pfL2A" });
    if (!liff.isLoggedIn()) await liff.login();

    const profile = await liff.getProfile();
    userId = profile.userId;
    userName = profile.displayName;
    document.getElementById("userInfo").textContent = `${userName} 您好`;

    // 同時發送請求，加快載入速度
    const [empRes, leaveRes] = await Promise.all([
      fetch(`${API_ENDPOINT}?action=getUserInfo&userId=${userId}`),
      fetch(`${API_ENDPOINT}?action=getLeaveRecords&userId=${userId}`)
    ]);

    const empInfo = await empRes.json();
    const records = await leaveRes.json();

    // 一次性渲染介面
    updateAnnualInfoUI(empInfo, records);
    renderLeaveRecords(records); // 需將原本 render 的邏輯抽離出來

  } catch (e) {
    console.error(e);
    document.getElementById("userInfo").textContent = "請在 LINE 開啟";
  }
}

// 修改為接收 empInfo 與 records，避免重複 fetch
function updateAnnualInfoUI(empInfo, records) {
  let usedSigned = 0;
  records.forEach(r => {
    if (r.leaveType === "特休" && r.signStatus === "已簽核") {
      usedSigned += parseFloat(r.leaveHours || 0);
    }
  });

  const remain = (empInfo.total || 0) - usedSigned;
  remainHours = remain;

  document.getElementById("annualInfo").innerHTML = 
    `<span style="font-size: 95%; white-space: nowrap;">累計年假：<b>${empInfo.total}</b> 小時，已休：<b>${usedSigned}</b> 小時，剩餘：<b style="color:${remain <= 0 ? 'red' : 'green'}">${remain}</b> 小時</span>`;
}

async function checkDuplicateLeave(sD,sT,eD,eT){
  try{
    const res=await fetch(`${API_ENDPOINT}?action=getLeaveRecords&userId=${userId}`);
    const records=await res.json();

    const newStart=`${sD} ${normalizeTime(sT)}`;
    const newEnd=`${eD} ${normalizeTime(eT)}`;

    return records.some(r=>{
      const existingStart=`${r.startDate} ${normalizeTime(r.startTime)}`;
      const existingEnd=`${r.endDate} ${normalizeTime(r.endTime)}`;
      return newStart===existingStart && newEnd===existingEnd;
    });

  }catch(e){
    console.error(e);
    return false;
  }
}

async function loadLeaveRecords(){
  const container = document.getElementById("leaveRecordList");
  container.innerHTML="<div style='text-align:center;'>載入中...</div>";

  try {
    const res = await fetch(`${API_ENDPOINT}?action=getLeaveRecords&userId=${userId}`);
    const data = await res.json();

    if(!data.length){
      container.innerHTML="<div style='text-align:center;'>無請假紀錄</div>";
      return;
    }

    container.innerHTML = data.map(r => {
      let cls = r.signStatus==='未簽核' ? 'badge-未簽核' :
                r.signStatus==='簽核中' ? 'badge-簽核中' : 'badge-已簽核';
      
      return `
        <div class="record-item">
          <div class="record-info">
            <div style="font-size:16px; font-weight:bold;">${r.leaveType} (${r.leaveHours}小時)</div>
            <div style="font-size:14px; color:#666;">${r.startDate} ${r.startTime} ~ ${r.endDate} ${r.endTime}</div>
            <div style="font-size:14px; color:#333;">事由：${r.leaveReason || "無"}</div>
          </div>
          <div class="status-badge ${cls}">${r.signStatus}</div>
        </div>
      `;
    }).join("");

  } catch(e) {
    console.error(e);
    container.innerHTML="<div style='text-align:center;'>讀取失敗</div>";
  }
}

document.getElementById("btnLeaveApply").onclick=async ()=>{

  const typesRes = await fetch(`${API_ENDPOINT}?action=getLeaveTypes`);
  const types = await typesRes.json();
  const optionsHTML = types.map(t=>`<option value="${t}">${t}</option>`).join("");

  Swal.fire({
    title:'📝 請假申請',
    width:'100%',
    html:`
    <div style="display:flex;flex-direction:column;gap:20px;font-size:26px;text-align:left;">

      <label>假別</label>
      <select id="leaveType" style="padding:20px;font-size:24px;border-radius:12px;">
        ${optionsHTML}
      </select>

      <label>事由（可不填）</label>
      <input id="leaveReason" placeholder="請輸入請假事由"
        style="padding:20px;font-size:24px;border-radius:12px;">

      <label>起始日期</label>
      <input type="date" id="leaveStartDate" style="padding:20px;font-size:24px;border-radius:12px;">

      <label>起始時間</label>
      <input type="time" id="leaveStartTime" value="09:00" style="padding:20px;font-size:24px;border-radius:12px;">

      <label>終止日期</label>
      <input type="date" id="leaveEndDate" style="padding:20px;font-size:24px;border-radius:12px;">

      <label>終止時間</label>
      <input type="time" id="leaveEndTime" value="18:00" style="padding:20px;font-size:24px;border-radius:12px;">

      <label>請假時數</label>
      <input id="leaveHours" readonly
        style="padding:20px;font-size:26px;font-weight:bold;background:#eee;border-radius:12px;">

      <div id="remainDisplay" style="margin-top:10px;">
        剩餘特休: ${remainHours} 小時
      </div>

    </div>
    `,
    showCancelButton:true,
    confirmButtonText:'送出',
    cancelButtonText:'取消',
    customClass:{
      confirmButton:'swal-btn',
      cancelButton:'swal-btn'
    },

    didOpen:()=>{

      const sD=document.getElementById("leaveStartDate"),
            sT=document.getElementById("leaveStartTime"),
            eD=document.getElementById("leaveEndDate"),
            eT=document.getElementById("leaveEndTime"),
            lH=document.getElementById("leaveHours"),
            lType=document.getElementById("leaveType"),
            rDisp=document.getElementById("remainDisplay");

      sD.addEventListener("change",()=>{
  eD.value = sD.value;
  calc();
});
      [sD,sT,eD,eT,lType].forEach(el=>el.addEventListener("change",calc));

      async function calc(){

  if(!sD.value||!sT.value||!eD.value||!eT.value) return;

  const startTime = new Date(`${sD.value}T${sT.value}`);
const endTime = new Date(`${eD.value}T${eT.value}`);

// 防呆1：起始與終止日期必須同一天
if (sD.value !== eD.value) {
  Swal.showValidationMessage("❌ 起始日期與終止日期必須為同一天");
  lH.value = 0;
  return;
}

// 防呆2：終止時間必須晚於起始時間
if (endTime <= startTime) {
  Swal.showValidationMessage("❌ 終止時間必須晚於起始時間");
  lH.value = 0;
  return;
}

Swal.resetValidationMessage();

  // ===== 改為呼叫後端實時計算 =====
  const res = await fetch(
    `${API_ENDPOINT}?action=calculateLeaveHours` +
    `&userId=${userId}` +
    `&startDate=${sD.value}` +
    `&startTime=${sT.value}` +
    `&endDate=${eD.value}` +
    `&endTime=${eT.value}`
  );

  const result = await res.json();

  let hours = Number(result.leaveHours || 0);

  // ===== 無排班 =====
  if(hours <= 0){
    Swal.showValidationMessage("查無符合排班時間");
    lH.value = 0;
    return;
  }

  // ===== 特休檢查 =====
  if(lType.value==="特休"){

    const realtimeRemain = await getRealtimeRemainHours();

    if(hours > realtimeRemain){

      Swal.showValidationMessage("❌ 請假時數超過剩餘特休");
      lH.value = hours.toFixed(2);

    }else{

      Swal.resetValidationMessage();
    }

    rDisp.textContent =
      `剩餘特休: ${Math.max(0,(realtimeRemain-hours)).toFixed(2)} 小時`;

  }else{

    Swal.resetValidationMessage();
    rDisp.textContent="";
  }

  lH.value = hours.toFixed(2);
}

      calc();
    },

    preConfirm: async ()=>{

      const lh=parseFloat(document.getElementById("leaveHours").value),
            lType=document.getElementById("leaveType").value,
            leaveReason=document.getElementById("leaveReason").value,
            sD=document.getElementById("leaveStartDate").value,
            sT=document.getElementById("leaveStartTime").value,
            eD=document.getElementById("leaveEndDate").value,
            eT=document.getElementById("leaveEndTime").value;
            eD.readOnly = true;

      // ✅ 事由改為非必填
      // 日期必填
if(!sD || !eD){
  Swal.showValidationMessage("請填完整日期");
  return false;
}

// 防呆1：起始與終止日期必須同一天
if(sD !== eD){
  Swal.showValidationMessage("❌ 起始日期與終止日期必須為同一天");
  return false;
}

// 防呆2：終止時間必須晚於起始時間
const startDateTime = new Date(`${sD}T${sT}`);
const endDateTime = new Date(`${eD}T${eT}`);

if(endDateTime <= startDateTime){
  Swal.showValidationMessage("❌ 終止時間必須晚於起始時間");
  return false;
}

      if(await checkDuplicateLeave(sD,sT,eD,eT)){
        Swal.showValidationMessage("❌ 已有相同時間的請假紀錄");
        return false;
      }

      if(lType==="特休"){
        const realtimeRemain = await getRealtimeRemainHours();
        if(lh>realtimeRemain){
          Swal.showValidationMessage("❌ 特休假已超時");
          return false;
        }
      }

      return {
        leaveType:lType,
        leaveReason,
        startDate:sD,
        startTime:sT,
        endDate:eD,
        endTime:eT,
        leaveHours:lh
      };
    }
  }).then(async(res)=>{

    if(!res.isConfirmed) return;

    const d=res.value;

    const response=await fetch(API_ENDPOINT,{
      method:"POST",
      body:JSON.stringify({
        action:"leave",
        userId,
        userName,
        ...d
      })
    });

    const result=await response.json();

    if(!result.success){
      Swal.fire({icon:"error",title:result.message});
      return;
    }

    Swal.fire({
      icon:"success",
      title:"完成",
      timer:1200,
      showConfirmButton:false
    });

    await loadAnnualInfo();
    loadLeaveRecords();
  });
};

window.onload=initLIFF;
</script>

</body>
</html>
